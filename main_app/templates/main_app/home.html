<h1>Selamat Datang di Kota Bandung</h1>
<p>website untuk pelaporan masalah.</p>
<h1>Daftar Laporan</h1>

<a href="/add/">Tambah Laporan</a>

<hr>

{% for report in reports %}
    <div style="border:1px solid black; padding:10px; margin-bottom:10px;">
        <p><b>Judul:</b> {{ report.title }}</p>
        <p><b>Lokasi:</b> {{ report.location }}</p>
        <p><b>Status:</b> {{ report.status }}</p>

        <a href="{% url 'report_detail' report.pk %}">Detail</a> |
        <a href="{% url 'update_report' report.pk %}">Edit</a> |
        <a href="{% url 'delete_report' report.pk %}">Hapus</a>

        <form action="{% url 'update_status' report.pk %}" method="POST" style="margin-top: 10px;">
            {% csrf_token %}
            <select name="status">
                <option value="REPORTED" {% if report.status == 'REPORTED' %}selected{% endif %}>Reported</option>
                <option value="VERIFIED" {% if report.status == 'VERIFIED' %}selected{% endif %}>Verified</option>
                <option value="IN PROGRESS" {% if report.status == 'IN PROGRESS' %}selected{% endif %}>In Progress</option>
                <option value="RESOLVED" {% if report.status == 'RESOLVED' %}selected{% endif %}>Resolved</option>
            </select>
            <button type="submit">Ubah Status</button>
        </form>
    </div>
{% endfor %}
