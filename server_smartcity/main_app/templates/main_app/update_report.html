{% extends 'base.html' %}

{% block title %}Edit Laporan - Bandung City{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'report_list' %}">Home</a></li>
    <li class="breadcrumb-item"><a href="{% url 'report_list' %}">Reports</a></li>
    <li class="breadcrumb-item active" aria-current="page">Edit Laporan</li>
  </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold text-dark">
                    <i class="bi bi-pencil-square text-info"></i> Edit Laporan
                </h4>
            </div>
            
            <div class="card-body p-4">
                <form method="POST" id="updateForm">
                    {% csrf_token %}
                    
                    <div class="mb-4 custom-form-group">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center border-top pt-4">
                        <a href="{% url 'report_list' %}" class="btn btn-secondary px-4">
                            <i class="bi bi-arrow-left"></i> Kembali
                        </a>

                        <button type="submit" class="btn btn-success px-4 fw-bold" id="updateBtn">
                            <i class="bi bi-check-circle"></i> Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .custom-form-group p { margin-bottom: 1.2rem; }
    .custom-form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; }
    .custom-form-group input, .custom-form-group textarea, .custom-form-group select {
        width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px;
    }
</style>

<script>
    // Script untuk Loading Feedback (Poin 7)
    document.getElementById('updateForm').onsubmit = function() {
        var btn = document.getElementById('updateBtn');
        btn.disabled = true; // Tombol jadi disable
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading...'; // Teks jadi Loading
        return true;
    };
</script>
{% endblock %}
