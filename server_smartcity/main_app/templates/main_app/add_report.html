{% extends 'base.html' %}

{% block title %}Tambah Laporan - Bandung City{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'report_list' %}">Home</a></li>
    <li class="breadcrumb-item"><a href="{% url 'report_list' %}">Reports</a></li>
    <li class="breadcrumb-item active" aria-current="page">Tambah Laporan</li>
  </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h4 class="mb-0 fw-bold text-dark">
                    <i class="bi bi-plus-circle text-primary me-2"></i>Tambah Laporan Baru
                </h4>
            </div>
            
            <div class="card-body p-4">
                <form method="POST" id="reportForm">
                    {% csrf_token %}
                    
                    <div class="mb-4 custom-form-group">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center border-top pt-4">
                        <a href="{% url 'report_list' %}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left"></i> Kembali
                        </a>

                        <button type="submit" class="btn btn-primary px-4 fw-bold" id="submitBtn">
                            <i class="bi bi-save me-1" id="saveIcon"></i>
                            <span id="btnText">Kirim Laporan</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Styling agar form Django {{ form.as_p }} terlihat modern */
    .custom-form-group p { 
        margin-bottom: 1.5rem; 
    }
    
    .custom-form-group label { 
        display: block; 
        font-weight: 600; 
        margin-bottom: 8px; 
        color: #444; 
    }

    .custom-form-group input, 
    .custom-form-group textarea, 
    .custom-form-group select {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }

    .custom-form-group input:focus, 
    .custom-form-group textarea:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
</style>

<script>
    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        var form = this;
        var btn = document.getElementById('submitBtn');
        var btnText = document.getElementById('btnText');
        var saveIcon = document.getElementById('saveIcon');

        btn.classList.add('disabled');
        btn.style.pointerEvents = 'none';
        saveIcon.className = 'spinner-border spinner-border-sm me-2';
        btnText.innerText = 'loading...';

        setTimeout(function() {
            form.submit();
        }, 2000); 
    });
</script>
{% endblock %}
