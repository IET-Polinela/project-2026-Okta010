{% extends 'base.html' %}

{% block content %}
<div class="container mt-2">
    <h2 class="fw-bold" style="color: #f759ab;">Dashboard Statistik Laporan</h2>
    <hr style="border-color: #ffd6e7;">
    
    <div class="row mb-5">
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm border-0" style="border-radius: 15px;">
                <h5 class="text-center mb-4 fw-bold" style="color: #eb2f96;">Distribusi Status Laporan</h5>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm border-0" style="border-radius: 15px;">
                <h5 class="text-center mb-4 fw-bold" style="color: #eb2f96;">Jumlah Laporan per Kategori</h5>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <h5 class="mb-3 fw-bold"><i class="bi bi-clock-history me-2"></i>5 Laporan Terbaru (REPORTED)</h5>
            <div class="table-responsive shadow-sm" style="border-radius: 10px;">
                <table class="table table-hover mb-0" id="tableReported">
                    <thead style="background-color: #f759ab; color: white;">
                        <tr>
                            <th>Judul</th>
                            <th>Kategori</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <h5 class="mb-3 fw-bold"><i class="bi bi-check-circle-fill me-2 text-success"></i>5 Laporan Terakhir Selesai (RESOLVED)</h5>
            <div class="table-responsive shadow-sm" style="border-radius: 10px;">
                <table class="table table-hover mb-0" id="tableResolved">
                    <thead style="background-color: #f759ab; color: white;">
                        <tr>
                            <th>Judul</th>
                            <th>Kategori</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // 1. Menggunakan Fetch API untuk menarik data (Instruksi No. 4)
    fetch("{% url 'dashboard:api_data' %}")
        .then(response => {
            if (!response.ok) throw new Error('Gagal mengambil data');
            return response.json();
        })
        .then(data => {
            // TAMPILKAN DI CONSOLE (Penting untuk Screenshot No. 6)
            console.log("Data JSON Berhasil Diterima:", data);

            // 2. Render Doughnut Chart untuk Status (Warna Pink Custom)
            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: data.status_labels,
                    datasets: [{
                        data: data.status_counts,
                        backgroundColor: ['#f759ab', '#ffadd2', '#eb2f96', '#722ed1', '#1890ff'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            // 3. Render Bar Chart untuk Kategori
            new Chart(document.getElementById('categoryChart'), {
                type: 'bar',
                data: {
                    labels: data.category_labels,
                    datasets: [{
                        label: 'Total Laporan',
                        data: data.category_counts,
                        backgroundColor: '#f759ab',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // 4. Isi Tabel Laporan Terbaru (REPORTED)
            const reportedBody = document.querySelector('#tableReported tbody');
            if (data.latest_reported && data.latest_reported.length > 0) {
                data.latest_reported.forEach(item => {
                    reportedBody.innerHTML += `<tr><td>${item.title}</td><td><span class="badge bg-light text-dark border">${item.category}</span></td></tr>`;
                });
            } else {
                reportedBody.innerHTML = '<tr><td colspan="2" class="text-center py-3 text-muted">Tidak ada laporan terbaru</td></tr>';
            }

            // 5. Isi Tabel Laporan Selesai (RESOLVED)
            const resolvedBody = document.querySelector('#tableResolved tbody');
            if (data.latest_resolved && data.latest_resolved.length > 0) {
                data.latest_resolved.forEach(item => {
                    resolvedBody.innerHTML += `<tr><td>${item.title}</td><td><span class="badge bg-light text-dark border">${item.category}</span></td></tr>`;
                });
            } else {
                resolvedBody.innerHTML = '<tr><td colspan="2" class="text-center py-3 text-muted">Tidak ada laporan selesai</td></tr>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.querySelector('.container').innerHTML += `<div class="alert alert-danger mt-3">Gagal memuat data dashboard: ${error.message}</div>`;
        });
</script>
{% endblock %}
